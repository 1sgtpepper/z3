name: Investigate issue 7842 arrangement diagnostic

on:
  push:
    branches: [investigate-7842-root-cause]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  arrangement-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout workflow branch
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Check out exact current upstream source
        run: |
          git remote add upstream https://github.com/Z3Prover/z3.git || true
          git fetch --depth=1 upstream e80eeb1150bf9d248778c6ea1937542ca109da27
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = e80eeb1150bf9d248778c6ea1937542ca109da27

      - name: Apply deliberately exhaustive shared-FP arrangement diagnostic
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/smt/theory_fpa.cpp')
          s = p.read_text()
          old = '''    final_check_status theory_fpa::final_check_eh(unsigned level) {
                  TRACE(t_fpa, tout << "final_check_eh\\n";);
                  SASSERT(m_converter.m_extra_assertions.empty());
                  return FC_DONE;
              }
          '''
          new = '''    final_check_status theory_fpa::final_check_eh(unsigned level) {
                  TRACE(t_fpa, tout << "final_check_eh\\n";);
                  SASSERT(m_converter.m_extra_assertions.empty());

                  // Diagnostic only: force a complete equality arrangement over
                  // relevant shared FPA terms. This is intentionally quadratic;
                  // it tests whether missing FPA -> core equality exchange is the
                  // cause, not whether this is an acceptable production strategy.
                  unsigned num = get_num_vars();
                  for (theory_var i = 0; i < num; ++i) {
                      enode* n1 = get_enode(i);
                      if (!n1 || !is_relevant_and_shared(n1))
                          continue;
                      for (theory_var j = 0; j < i; ++j) {
                          enode* n2 = get_enode(j);
                          if (!n2 || !is_relevant_and_shared(n2) ||
                              n1->get_expr()->get_sort() != n2->get_expr()->get_sort())
                              continue;
                          if (assume_eq(n1, n2))
                              return FC_CONTINUE;
                      }
                  }
                  return FC_DONE;
              }
          '''
          if old not in s:
              raise SystemExit('final_check_eh source pattern not found')
          p.write_text(s.replace(old, new, 1))
          PY
          git diff --check
          git diff -- src/smt/theory_fpa.cpp

      - name: Configure and build debug Z3 plus unit tests
        run: |
          python scripts/mk_make.py -d
          make -C build -j"$(nproc)"
          make -C build -j"$(nproc)" test-z3

      - name: Create causal matrix
        run: |
          mkdir -p issue7842-arrangement

          cat > issue7842-arrangement/01-issue-7842.smt2 <<'EOF'
          (set-logic ALL)
          (declare-datatype Expr ((Flt (getFlt_1 (_ FloatingPoint 8 24)))))
          (declare-fun x () Expr)
          (assert (distinct x (Flt (_ NaN 8 24))))
          (assert (fp.isNaN (getFlt_1 x)))
          (check-sat)
          EOF

          cat > issue7842-arrangement/02-general-uf-isnan.smt2 <<'EOF'
          (set-logic ALL)
          (declare-fun a () (_ FloatingPoint 8 24))
          (declare-fun b () (_ FloatingPoint 8 24))
          (declare-fun g ((_ FloatingPoint 8 24)) Int)
          (assert (fp.isNaN a))
          (assert (fp.isNaN b))
          (assert (distinct (g a) (g b)))
          (check-sat)
          EOF

          cat > issue7842-arrangement/03-issue-6728.smt2 <<'EOF'
          (set-logic ALL)
          (declare-const c RoundingMode)
          (declare-const x Float64)
          (declare-sort T 0)
          (declare-fun f (Float64) T)
          (assert (not (= (f (fp.add c x (_ NaN 11 53)))
                          (f (fp.add c (_ NaN 11 53) x)))))
          (check-sat)
          EOF

          cat > issue7842-arrangement/04-array-congruence.smt2 <<'EOF'
          (set-logic ALL)
          (declare-fun a () (_ FloatingPoint 8 24))
          (declare-fun b () (_ FloatingPoint 8 24))
          (declare-fun A () (Array (_ FloatingPoint 8 24) Int))
          (assert (fp.isNaN a))
          (assert (fp.isNaN b))
          (assert (distinct (select A a) (select A b)))
          (check-sat)
          EOF

          cat > issue7842-arrangement/05-nested-datatype.smt2 <<'EOF'
          (set-logic ALL)
          (declare-datatype Inner ((I (iv (_ FloatingPoint 8 24)))))
          (declare-datatype Outer ((O (ov Inner))))
          (declare-fun x () Outer)
          (assert (distinct x (O (I (_ NaN 8 24)))))
          (assert (fp.isNaN (iv (ov x))))
          (check-sat)
          EOF

          cat > issue7842-arrangement/06-plus-minus-zero-control.smt2 <<'EOF'
          (set-logic ALL)
          (declare-fun g ((_ FloatingPoint 8 24)) Int)
          (assert (distinct (g (_ +zero 8 24)) (g (_ -zero 8 24))))
          (check-sat)
          (get-model)
          EOF

          cat > issue7842-arrangement/07-unconstrained-fp-control.smt2 <<'EOF'
          (set-logic ALL)
          (declare-fun a () (_ FloatingPoint 8 24))
          (declare-fun b () (_ FloatingPoint 8 24))
          (declare-fun g ((_ FloatingPoint 8 24)) Int)
          (assert (distinct (g a) (g b)))
          (check-sat)
          (get-model)
          EOF

          cat > issue7842-arrangement/08-direct-nan-diseq-control.smt2 <<'EOF'
          (set-logic ALL)
          (declare-fun a () (_ FloatingPoint 8 24))
          (declare-fun b () (_ FloatingPoint 8 24))
          (assert (fp.isNaN a))
          (assert (fp.isNaN b))
          (assert (distinct a b))
          (check-sat)
          EOF

      - name: Run causal matrix with model validation
        shell: bash
        run: |
          set +e
          {
            echo "upstream=$(git rev-parse HEAD)"
            echo "z3=$(build/z3 -version)"
            echo
            for f in issue7842-arrangement/*.smt2; do
              echo "===== $(basename "$f") ====="
              timeout 120 build/z3 model_validate=true "$f" 2>&1
              echo "exit=$?"
              echo
            done
          } | tee issue7842-arrangement-results.txt
          exit 0

      - name: Run upstream unit suite
        run: build/test-z3 -a

      - name: Upload exact outputs and patch
        run: git diff -- src/smt/theory_fpa.cpp > issue7842-arrangement.patch

      - uses: actions/upload-artifact@v4
        with:
          name: issue-7842-arrangement-diagnostic
          path: |
            issue7842-arrangement-results.txt
            issue7842-arrangement.patch
            issue7842-arrangement/*.smt2
          if-no-files-found: error
