name: Investigate issue 7842 semantic NaN anchor

on:
  push:
    branches: [investigate-7842-nan-anchor]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nan-anchor-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout diagnostic branch
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Preserve harness and check out exact current upstream source
        run: |
          cp .github/diagnostics/issue_7842_nan_anchor.py /tmp/issue_7842_nan_anchor.py
          git remote add upstream https://github.com/Z3Prover/z3.git || true
          git fetch --depth=1 upstream e80eeb1150bf9d248778c6ea1937542ca109da27
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = e80eeb1150bf9d248778c6ea1937542ca109da27

      - name: Configure and build exact baseline
        run: |
          python scripts/mk_make.py -d
          make -C build -j"$(nproc)"
          make -C build -j"$(nproc)" test-z3

      - name: Prepare oracle matrix including historical regression
        run: python /tmp/issue_7842_nan_anchor.py prepare
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Run exact-baseline matrix
        run: python /tmp/issue_7842_nan_anchor.py baseline

      - name: Apply abstract semantic NaN-equality anchor
        run: |
          python /tmp/issue_7842_nan_anchor.py patch
          git diff --check
          git diff -- src/smt/theory_fpa.cpp | tee issue7842-nan-anchor/semantic-nan-anchor.patch

      - name: Rebuild patched solver
        run: make -C build -j"$(nproc)"

      - name: Run patched matrix and enforce semantic oracle
        run: python /tmp/issue_7842_nan_anchor.py patched

      - name: Run upstream unit suite with patch
        run: build/test-z3 -a

      - name: Upload exact diagnostic evidence
        uses: actions/upload-artifact@v4
        with:
          name: issue-7842-semantic-nan-anchor
          path: issue7842-nan-anchor/
          if-no-files-found: error
