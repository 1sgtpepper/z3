name: Diagnose FPA route

on:
  push:
    branches: [validate-fpa-division-widths-final]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Configure
        run: python scripts/mk_make.py

      - name: Build Z3
        run: make -C build -j2

      - name: Checkout exact regression head
        run: |
          git clone https://github.com/1sgtpepper/z3test z3test
          git -C z3test checkout 294c407

      - name: Diagnose symbolic wide division
        run: |
          set +e
          benchmark=z3test/regressions/smt2/10175-wide.smt2
          run_case() {
            mode="$1"
            tactic="$2"
            echo "=== $mode ==="
            {
              sed '/^(check-sat-using/,$d' "$benchmark"
              echo "$tactic"
              echo '(get-info :reason-unknown)'
            } | timeout 60 build/z3 -v:10 model=true model_validate=false -st /dev/stdin 2>&1
            echo "exit=$?"
          }
          run_case converter-sat '(check-sat-using (then fpa2bv simplify propagate-values solve-eqs simplify bit-blast sat))'
          run_case converter-qfbv '(check-sat-using (then fpa2bv qfbv))'
          run_case converter-solve-qfbv '(check-sat-using (then fpa2bv simplify propagate-values solve-eqs simplify qfbv))'
          run_case qffp '(check-sat-using qffp)'
