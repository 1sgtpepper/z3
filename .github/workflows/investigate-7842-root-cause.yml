name: Investigate issue 7842 root cause

on:
  push:
    branches: [investigate-7842-root-cause]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostic-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout workflow branch
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Check out exact current upstream source
        run: |
          git remote add upstream https://github.com/Z3Prover/z3.git || true
          git fetch --depth=1 upstream d7777e2ddd5be9c55b376db4ebebbb33b39bf45f
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = d7777e2ddd5be9c55b376db4ebebbb33b39bf45f

      - name: Configure and build using upstream debug-build path
        run: |
          python scripts/mk_make.py -d
          make -C build -j"$(nproc)"

      - name: Create diagnostic matrix
        run: |
          mkdir -p issue7842-cases

          cat > issue7842-cases/01-original.smt2 <<'EOF'
          (set-logic ALL)
          (declare-datatype Expr ((Flt (getFlt_1 (_ FloatingPoint 8 24)))))
          (declare-fun x () Expr)
          (assert (distinct x (Flt (_ NaN 8 24))))
          (assert (fp.isNaN (getFlt_1 x)))
          (check-sat)
          (get-model)
          EOF

          cat > issue7842-cases/02-selector-diseq-control.smt2 <<'EOF'
          (set-logic ALL)
          (declare-datatype Expr ((Flt (getFlt_1 (_ FloatingPoint 8 24)))))
          (declare-fun x () Expr)
          (assert (distinct (getFlt_1 x) (_ NaN 8 24)))
          (assert (fp.isNaN (getFlt_1 x)))
          (check-sat)
          EOF

          cat > issue7842-cases/03-explicit-field-equality-control.smt2 <<'EOF'
          (set-logic ALL)
          (declare-datatype Expr ((Flt (getFlt_1 (_ FloatingPoint 8 24)))))
          (declare-fun x () Expr)
          (assert (distinct x (Flt (_ NaN 8 24))))
          (assert (= (getFlt_1 x) (_ NaN 8 24)))
          (check-sat)
          EOF

          cat > issue7842-cases/04-finite-fp-semantic-equality.smt2 <<'EOF'
          (set-logic ALL)
          (declare-datatype Expr ((Flt (getFlt_1 (_ FloatingPoint 8 24)))))
          (declare-fun x () Expr)
          (define-fun one () (_ FloatingPoint 8 24)
            (fp #b0 #b01111111 #b00000000000000000000000))
          (assert (distinct x (Flt one)))
          (assert (fp.eq (getFlt_1 x) one))
          (check-sat)
          (get-model)
          EOF

          cat > issue7842-cases/05-finite-fp-core-equality-control.smt2 <<'EOF'
          (set-logic ALL)
          (declare-datatype Expr ((Flt (getFlt_1 (_ FloatingPoint 8 24)))))
          (declare-fun x () Expr)
          (define-fun one () (_ FloatingPoint 8 24)
            (fp #b0 #b01111111 #b00000000000000000000000))
          (assert (distinct x (Flt one)))
          (assert (= (getFlt_1 x) one))
          (check-sat)
          EOF

          cat > issue7842-cases/06-two-field-fp.smt2 <<'EOF'
          (set-logic ALL)
          (declare-datatype Pair ((Pair2
            (fst (_ FloatingPoint 8 24))
            (snd (_ FloatingPoint 8 24)))))
          (declare-fun x () Pair)
          (define-fun one () (_ FloatingPoint 8 24)
            (fp #b0 #b01111111 #b00000000000000000000000))
          (assert (distinct x (Pair2 (_ NaN 8 24) one)))
          (assert (fp.isNaN (fst x)))
          (assert (fp.eq (snd x) one))
          (check-sat)
          (get-model)
          EOF

          cat > issue7842-cases/07-nested-datatypes.smt2 <<'EOF'
          (set-logic ALL)
          (declare-datatype Inner ((I (iv (_ FloatingPoint 8 24)))))
          (declare-datatype Outer ((O (ov Inner))))
          (declare-fun x () Outer)
          (assert (distinct x (O (I (_ NaN 8 24)))))
          (assert (fp.isNaN (iv (ov x))))
          (check-sat)
          (get-model)
          EOF

          cat > issue7842-cases/08-int-derived-equality.smt2 <<'EOF'
          (set-logic ALL)
          (declare-datatype Box ((BoxInt (ival Int))))
          (declare-fun x () Box)
          (assert (distinct x (BoxInt 0)))
          (assert (<= (ival x) 0))
          (assert (>= (ival x) 0))
          (check-sat)
          (get-model)
          EOF

          cat > issue7842-cases/09-bv-bitwise-derived-equality.smt2 <<'EOF'
          (set-logic ALL)
          (declare-datatype Box ((BoxBV (bval (_ BitVec 8)))))
          (declare-fun x () Box)
          (assert (distinct x (BoxBV #x00)))
          (assert (= ((_ extract 0 0) (bval x)) #b0))
          (assert (= ((_ extract 1 1) (bval x)) #b0))
          (assert (= ((_ extract 2 2) (bval x)) #b0))
          (assert (= ((_ extract 3 3) (bval x)) #b0))
          (assert (= ((_ extract 4 4) (bval x)) #b0))
          (assert (= ((_ extract 5 5) (bval x)) #b0))
          (assert (= ((_ extract 6 6) (bval x)) #b0))
          (assert (= ((_ extract 7 7) (bval x)) #b0))
          (check-sat)
          (get-model)
          EOF

          cat > issue7842-cases/10-uf-explicit-equality-control.smt2 <<'EOF'
          (set-logic ALL)
          (declare-sort U 0)
          (declare-datatype Box ((BoxU (uval U))))
          (declare-fun x () Box)
          (declare-fun u () U)
          (assert (distinct x (BoxU u)))
          (assert (= (uval x) u))
          (check-sat)
          EOF

          cat > issue7842-cases/11-multiconstructor-fp.smt2 <<'EOF'
          (set-logic ALL)
          (declare-datatype Expr
            ((Flt (getFlt (_ FloatingPoint 8 24))) (Other)))
          (declare-fun x () Expr)
          (assert ((_ is Flt) x))
          (assert (distinct x (Flt (_ NaN 8 24))))
          (assert (fp.isNaN (getFlt x)))
          (check-sat)
          (get-model)
          EOF

      - name: Run matrix with model validation
        shell: bash
        run: |
          set +e
          {
            echo "upstream=$(git rev-parse HEAD)"
            echo "z3=$(build/z3 -version)"
            echo
            for f in issue7842-cases/*.smt2; do
              echo "===== $(basename "$f") ====="
              build/z3 model_validate=true "$f" 2>&1
              echo "exit=$?"
              echo
            done
          } | tee issue7842-results.txt
          exit 0

      - name: Run original under selected front-end configurations
        shell: bash
        run: |
          set +e
          {
            for opts in "" "smt.relevancy=0" "smt.relevancy=2" "smt.dt_lazy_splits=0" "smt.dt_lazy_splits=2"; do
              echo "===== opts: ${opts:-default} ====="
              build/z3 model_validate=true $opts issue7842-cases/01-original.smt2 2>&1
              echo "exit=$?"
              echo
            done
          } | tee issue7842-options.txt
          exit 0

      - name: Upload exact diagnostic outputs
        uses: actions/upload-artifact@v4
        with:
          name: issue-7842-diagnostic-results
          path: |
            issue7842-results.txt
            issue7842-options.txt
            issue7842-cases/*.smt2
          if-no-files-found: error
