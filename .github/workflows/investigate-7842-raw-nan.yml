name: Compare issue 7842 NaN identity repairs

on:
  push:
    branches: [investigate-7842-raw-nan]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          path: diagnostic
      - uses: actions/checkout@v7.0.1
        with:
          repository: Z3Prover/z3
          ref: 2d2fb04fe3f1ab2111b550645f7c49198a3165f6
          path: source
      - name: Record source and inputs
        run: |
          mkdir evidence
          git -C diagnostic rev-parse HEAD > evidence/harness-revision.txt
          git -C source rev-parse HEAD > evidence/source-revision.txt
          test "$(cat evidence/source-revision.txt)" = 2d2fb04fe3f1ab2111b550645f7c49198a3165f6
          test -z "$(git -C source status --porcelain)"
          cp -r diagnostic/cases diagnostic/patches evidence/
      - name: Restore exact instrumented baseline build
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: source/build
          key: issue-7842-debug-ubuntu24-2d2fb04fe3f1ab2111b550645f7c49198a3165f6-${{ hashFiles('diagnostic/patches/trace.patch') }}
          restore-keys: issue-7842-debug-ubuntu24-f85ec6c198b4ba8dd95c33005731f8a3a5c13f88-${{ hashFiles('diagnostic/patches/trace.patch') }}
      - name: Build instrumented baseline
        working-directory: source
        run: |
          set -o pipefail
          git apply --check ../diagnostic/patches/trace.patch
          git apply ../diagnostic/patches/trace.patch
          python3 scripts/mk_make.py -d 2>&1 | tee ../evidence/configure.log
          if [ "${{ steps.cache.outputs.cache-hit }}" = true ]; then
            python3 - <<'PYCODE'
          import hashlib
          import json
          import os
          from pathlib import Path
          import subprocess
          identity = json.loads(Path('build/issue-7842-cache-identity.json').read_text())
          assert identity['source'] == subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          assert identity['trace_sha256'] == hashlib.sha256(Path('../diagnostic/patches/trace.patch').read_bytes()).hexdigest()
          assert identity['binary_sha256'] == hashlib.sha256(Path('build/z3').read_bytes()).hexdigest()
          # Exact-source cache: avoid rebuilding unchanged files solely for checkout times.
          stamp = int(subprocess.check_output(['git', 'show', '-s', '--format=%ct', 'HEAD']))
          for path in Path('src').rglob('*'):
              if path.is_file():
                  os.utime(path, (stamp, stamp))
          PYCODE
          fi
          make -C build -j1 smt/theory_fpa.o 2>&1 | tee ../evidence/instrumentation-build.log
          make -C build -j4 2>&1 | tee ../evidence/baseline-build.log
          build/z3 -version > ../evidence/version.txt
          python3 - <<'PYCODE'
          import hashlib
          import json
          from pathlib import Path
          import subprocess
          identity = dict(source=subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
                          trace_sha256=hashlib.sha256(Path('../diagnostic/patches/trace.patch').read_bytes()).hexdigest(),
                          binary_sha256=hashlib.sha256(Path('build/z3').read_bytes()).hexdigest())
          Path('build/issue-7842-cache-identity.json').write_text(json.dumps(identity, indent=2) + '\n')
          PYCODE
      - name: Save baseline build
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: source/build
          key: issue-7842-debug-ubuntu24-2d2fb04fe3f1ab2111b550645f7c49198a3165f6-${{ hashFiles('diagnostic/patches/trace.patch') }}
      - name: Record all variants
        run: |
          set -o pipefail
          previous=""
          for variant in baseline raw bridge rewrite; do
            if [ -n "$previous" ]; then
              git -C source apply -R "../diagnostic/patches/$previous.patch"
            fi
            if [ "$variant" != baseline ]; then
              git -C source apply --check "../diagnostic/patches/$variant.patch"
              git -C source apply "../diagnostic/patches/$variant.patch"
              make -C source/build -j4 2>&1 | tee "evidence/$variant-build.log"
              previous="$variant"
            fi
            git -C source diff --check
            git -C source diff > "evidence/$variant-source.patch"
            mkdir -p "evidence/$variant"
            sha256sum source/build/z3 source/build/libz3.so > "evidence/$variant/binary-hashes.txt"
            probe_status=0
            PYTHONPATH="$PWD/source/build/python" Z3_LIBRARY_PATH="$PWD/source/build" LD_LIBRARY_PATH="$PWD/source/build" \
              timeout 15s python3 diagnostic/rewrite_probe.py > "evidence/$variant/rewrite-probe.json" \
              2> "evidence/$variant/rewrite-probe.stderr" || probe_status=$?
            echo "$probe_status" > "evidence/$variant/rewrite-probe-exit.txt"
            if [ "$probe_status" != 0 ]; then
              echo "Rejecting $variant after rewrite probe failure: $probe_status"
              continue
            fi
            python3 diagnostic/record.py "$variant" source evidence
          done
      - name: Evaluate semantic outcomes and trace coverage
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          for stage in ('baseline', 'raw', 'bridge', 'rewrite'):
              probe_status = int((Path('evidence') / stage / 'rewrite-probe-exit.txt').read_text())
              if probe_status:
                  print(stage, 'rejected by rewrite progress probe:', probe_status)
                  continue
              rows = json.loads((Path('evidence') / stage / 'results.json').read_text())
              assert len(rows) == 275, (stage, len(rows))
              assert len({(r['case'], r['configuration']) for r in rows}) == 275
              print(stage, sum(r['passed'] for r in rows), '/', len(rows))
              for row in rows:
                  if not row['passed']:
                      print('Unresolved:', row['case'], row['configuration'], row['actual'], row['expected'], row['exit_code'])
              for case in ('01-issue-7842.smt2', '26-symbolic-payloads-uf.smt2', '35-raw-uf-with-arithmetic.smt2', '38-bridge-distinct-payloads.smt2'):
                  for mode in ('relevancy-0', 'relevancy-2', 'euf'):
                      row = next(r for r in rows if r['case'] == case and r['configuration'] == mode)
                      print('Coverage:', stage, case, mode, row['effective_relevancy'], row['observed_fp_engines'])
          assert (Path('evidence') / 'baseline' / 'results.json').exists(), 'baseline probe must succeed'
          PY
      - name: Preserve diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-7842-repair-comparison
          path: evidence/
          if-no-files-found: error
