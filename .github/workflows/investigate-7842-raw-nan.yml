name: Check NaN relevance after search backtracking

on:
  push:
    branches: [investigate-7842-raw-nan]

permissions:
  contents: read

jobs:
  debug:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          path: diagnostic
      - uses: actions/checkout@v7.0.1
        with:
          repository: Z3Prover/z3
          ref: 2d2fb04fe3f1ab2111b550645f7c49198a3165f6
          path: source
      - name: Record source and inputs
        run: |
          mkdir evidence
          git -C diagnostic rev-parse HEAD > evidence/harness-revision.txt
          git -C source rev-parse HEAD > evidence/source-revision.txt
          test "$(cat evidence/source-revision.txt)" = 2d2fb04fe3f1ab2111b550645f7c49198a3165f6
          test -z "$(git -C source status --porcelain)"
          mkdir evidence/patches
          cp diagnostic/patches/{trace,replay-trace,paired}.patch evidence/patches/
          cp diagnostic/replay.py evidence/
          cp -r diagnostic/replay-controls evidence/
      - name: Restore exact instrumented baseline build
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: source/build
          key: issue-7842-debug-ubuntu24-2d2fb04fe3f1ab2111b550645f7c49198a3165f6-${{ hashFiles('diagnostic/patches/trace.patch') }}
          restore-keys: issue-7842-debug-ubuntu24-f85ec6c198b4ba8dd95c33005731f8a3a5c13f88-${{ hashFiles('diagnostic/patches/trace.patch') }}
      - name: Build instrumented baseline
        working-directory: source
        run: |
          set -o pipefail
          git apply --check ../diagnostic/patches/trace.patch
          git apply ../diagnostic/patches/trace.patch
          python3 scripts/mk_make.py -d 2>&1 | tee ../evidence/configure.log
          if [ "${{ steps.cache.outputs.cache-hit }}" = true ]; then
            python3 - <<'PYCODE'
          import hashlib
          import json
          import os
          from pathlib import Path
          import subprocess
          identity = json.loads(Path('build/issue-7842-cache-identity.json').read_text())
          assert identity['source'] == subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          assert identity['trace_sha256'] == hashlib.sha256(Path('../diagnostic/patches/trace.patch').read_bytes()).hexdigest()
          assert identity['binary_sha256'] == hashlib.sha256(Path('build/z3').read_bytes()).hexdigest()
          # Exact-source cache: avoid rebuilding unchanged files solely for checkout times.
          stamp = int(subprocess.check_output(['git', 'show', '-s', '--format=%ct', 'HEAD']))
          for path in Path('src').rglob('*'):
              if path.is_file():
                  os.utime(path, (stamp, stamp))
          PYCODE
          fi
          make -C build -j1 smt/theory_fpa.o 2>&1 | tee ../evidence/instrumentation-build.log
          make -C build -j4 2>&1 | tee ../evidence/baseline-build.log
          build/z3 -version > ../evidence/version.txt
          python3 - <<'PYCODE'
          import hashlib
          import json
          from pathlib import Path
          import subprocess
          identity = dict(source=subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
                          trace_sha256=hashlib.sha256(Path('../diagnostic/patches/trace.patch').read_bytes()).hexdigest(),
                          binary_sha256=hashlib.sha256(Path('build/z3').read_bytes()).hexdigest())
          Path('build/issue-7842-cache-identity.json').write_text(json.dumps(identity, indent=2) + '\n')
          PYCODE
      - name: Save baseline build
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: source/build
          key: issue-7842-debug-ubuntu24-2d2fb04fe3f1ab2111b550645f7c49198a3165f6-${{ hashFiles('diagnostic/patches/trace.patch') }}
      - name: Check selected search replay
        run: |
          set -o pipefail
          git -C source apply --check ../diagnostic/patches/replay-trace.patch
          git -C source apply ../diagnostic/patches/replay-trace.patch
          make -C source/build -j4 2>&1 | tee evidence/replay-build.log
          git -C source diff > evidence/baseline-source.patch
          mkdir -p evidence/baseline
          sha256sum source/build/z3 source/build/libz3.so > evidence/baseline/binary-hashes.txt
          python3 diagnostic/replay.py baseline source evidence
          git -C source apply --check ../diagnostic/patches/paired.patch
          git -C source apply ../diagnostic/patches/paired.patch
          git -C source diff --check
          git -C source diff > evidence/paired-source.patch
          make -C source/build -j4 2>&1 | tee evidence/paired-build.log
          mkdir -p evidence/paired
          sha256sum source/build/z3 source/build/libz3.so > evidence/paired/binary-hashes.txt
          python3 diagnostic/replay.py paired source evidence
      - name: Check selected search outcomes
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          output = Path('evidence/paired')
          rows = json.loads((output / 'replay/results.json').read_text())
          assert len(rows) == 6 and all(r['passed'] for r in rows)
          print('Selected candidate: six search controls passed; inspect relevance and scope traces.')
          PY
      - name: Preserve search replay evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-7842-search-replay
          path: evidence/
          if-no-files-found: error
