name: Validate issue 7842

on:
  push:
    branches: [validate-issue-7842-current]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - name: Build Z3
        run: |
          python scripts/mk_make.py -d
          make -C build -j2
      - name: Isolate the equality boundary
        run: |
          cat > direct-fp.smt2 <<'EOF'
          (set-logic QF_FP)
          (declare-fun x () Float32)
          (assert (distinct x (_ NaN 8 24)))
          (assert (fp.isNaN x))
          (check-sat)
          EOF
          cat > selector-fp.smt2 <<'EOF'
          (set-logic ALL)
          (declare-datatype Expr ((Flt (getFlt_1 (_ FloatingPoint 8 24)))))
          (declare-fun x () Expr)
          (assert (distinct (getFlt_1 x) (_ NaN 8 24)))
          (assert (fp.isNaN (getFlt_1 x)))
          (check-sat)
          EOF
          cat > datatype-fp.smt2 <<'EOF'
          (set-logic ALL)
          (declare-datatype Expr ((Flt (getFlt_1 (_ FloatingPoint 8 24)))))
          (declare-fun x () Expr)
          (assert (distinct x (Flt (_ NaN 8 24))))
          (assert (fp.isNaN (getFlt_1 x)))
          (check-sat)
          EOF
          direct="$(build/z3 direct-fp.smt2)"
          selector="$(build/z3 selector-fp.smt2)"
          datatype="$(build/z3 model_validate=true datatype-fp.smt2)"
          printf 'direct=%s\nselector=%s\ndatatype=%s\n' "$direct" "$selector" "$datatype"
          test "$direct" = unsat
          test "$selector" = unsat
          test "${datatype%%$'\n'*}" = sat
